<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>أزخرف بالمربع والمستطيل</title></head><body><main class="page" style="background-image:url('bg-try.png')"><div class="board"><div class="title">لِنُجَرِّبْ مَعًا</div><video id="to" class="character" src="try-open.mp4" controls autoplay></video><div class="row"><button class="btn pinkb" onclick="pick='sq'">◻️ مُرَبَّعٌ</button><button class="btn" onclick="pick='rect'">▭ مُسْتَطِيلٌ</button><button class="color" style="background:#f575aa" onclick="tcol='#f575aa'"></button><button class="color" style="background:#4fc3ee" onclick="tcol='#4fc3ee'"></button><button class="color" style="background:#ffd04b" onclick="tcol='#ffd04b'"></button><button class="color" style="background:#9566e8" onclick="tcol='#9566e8'"></button></div><div id="slots" class="slots"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div><div class="row"><button class="btn" onclick="repeatTry()">كَرِّرْ ✨</button><button class="btn alt" onclick="addOther()">أُضِيفُ شَكْلًا آخَرَ</button><button class="btn pinkb" onclick="finishTry()">شَاهِدْنَ زَخْرَفَتَنَا!</button></div><video id="tc" class="character hidden" src="try-close.mp4" controls></video></div></main><script src="common.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{document.body.insertAdjacentHTML('beforeend',nav('08-art-steps.html','10-art-homeland.html'));let pick='sq',tcol='#f575aa',idx=0,alt=false;window.repeatTry=()=>{if(idx>=6)return;let d=document.createElement('div');d.className=pick==='sq'?'smallshape':'smallrect';d.style.background=tcol;slots.children[idx++].appendChild(d)};window.addOther=()=>{pick=pick==='sq'?'rect':'sq';alt=true};window.finishTry=()=>{while(idx<6)repeatTry();tc.classList.remove('hidden');tc.play()}});</script></body></html>
