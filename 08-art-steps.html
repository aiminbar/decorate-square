<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>أزخرف بالمربع والمستطيل</title></head><body><main class="page" style="background-image:url('bg-steps.png')"><div class="board"><div class="title">خُطُواتُ عَمَلِي الْفَنِّيِّ</div><video id="so" class="character" src="steps-open.mp4" controls autoplay></video><div class="stepbar"><button class="step" onclick="step(1)">١ أَرْسُمُ 🔊</button><button class="step" onclick="step(2)">٢ أَقُصُّ 🔊</button><button class="step" onclick="step(3)">٣ أُلْصِقُ 🔊</button><button class="step" onclick="step(4)">٤ أُزَخْرِفُ 🔊</button></div><div id="stepArea" class="assess"><div class="row"><div class="shape sq dotted"></div><div class="shape rect dotted"></div></div><div id="stepMsg" class="msg">اختاري خطوة.</div></div><video id="warn" class="character hidden" src="minbar-warning.mp4" controls></video><button class="btn alt" onclick="finishSteps()">رَتِّبِي الْخُطُواتِ 🧩</button><video id="sc" class="character hidden" src="steps-close.mp4" controls></video><audio id="aud"></audio></div></main><script src="common.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{document.body.insertAdjacentHTML('beforeend',nav('07-demonstration.html','09-try-together.html'));window.step=n=>{let files=['','draw.wav','cut.wav','glue.wav','decorate.wav'],msgs=['','أَرْسُمُ الشَّكْلَ الْهَنْدَسِيَّ.','أَقُصُّ الشَّكْلَ الْهَنْدَسِيَّ.','أُلْصِقُ الشَّكْلَ الْهَنْدَسِيَّ.','أُزَخْرِفُ الشَّكْلَ.'];aud.src=files[n];aud.play();stepMsg.textContent=msgs[n];if(n===2){warn.classList.remove('hidden');warn.play();warn.onended=()=>{warn.classList.add('hidden');stepArea.animate([{transform:'scale(1)'},{transform:'scale(.96)'},{transform:'scale(1)'}],900)}}};window.finishSteps=()=>{stepMsg.textContent='أَرْسُمُ → أَقُصُّ → أُلْصِقُ → أُزَخْرِفُ';sc.classList.remove('hidden');sc.play()}});</script></body></html>
